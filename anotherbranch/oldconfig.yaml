apiVersion: v1
data:
  application-log.conf: |
    [INPUT]
        Name                tail
        Tag                 kube.<namespace_name>.<container_name>.<pod_name>.<container_id>   
        Tag_Regex           (?<pod_name>[a-z0-9](?:[-a-z0-9]*[a-z0-9])?(?:\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*)_(?<namespace_name>[^_]+)_(?<container_name>.+)-(?<container_id>[a-z0-9]{64})\.log$
        Exclude_Path        /var/log/containers/cloudwatch-agent*, /var/log/containers/fluent-bit*, /var/log/containers/aws-node*, /var/log/containers/kube-proxy*, /var/log/containers/fluentd*
        Path                /var/log/containers/*.log
        multiline.parser    cri, docker
        Parser              cri, docker
        DB                  /var/fluent-bit/state/flb_container.db
        Mem_Buf_Limit       50MB
        Skip_Long_Lines     On
        Refresh_Interval    10
        Rotate_Wait         30
        storage.type        filesystem
        Read_from_Head      ${READ_FROM_HEAD}

    [INPUT]
        Name                tail
        Tag                 application.*
        Path                /var/log/containers/fluent-bit*
        multiline.parser    docker, cri
        DB                  /var/fluent-bit/state/flb_log.db
        Mem_Buf_Limit       5MB
        Skip_Long_Lines     On
        Refresh_Interval    10
        Read_from_Head      ${READ_FROM_HEAD}

    [INPUT]
        Name                tail
        Tag                 application.*
        Path                /var/log/containers/cloudwatch-agent*
        multiline.parser    docker, cri
        DB                  /var/fluent-bit/state/flb_cwagent.db
        Mem_Buf_Limit       5MB
        Skip_Long_Lines     On
        Refresh_Interval    10
        Read_from_Head      ${READ_FROM_HEAD}

    [FILTER]
        Name                kubernetes
        Match               kube.vccedge-uat.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_Tag_Prefix     kube.
        Regex_Parser        custom-tag
        Merge_Log           On
        Merge_Log_Key       log_processed
        K8S-Logging.Parser  On
        K8S-Logging.Exclude Off
        Labels              Off
        Annotations         Off
        Use_Kubelet         On
        Kubelet_Port        10250
        Buffer_Size         0

    [FILTER]
        Name                kubernetes
        Match               kube.vccedge-prod.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_Tag_Prefix     kube.
        Regex_Parser        custom-tag
        Merge_Log           On
        Merge_Log_Key       log_processed
        K8S-Logging.Parser  On
        K8S-Logging.Exclude Off
        Labels              Off
        Annotations         Off
        Use_Kubelet         On
        Kubelet_Port        10250
        Buffer_Size         0

    [FILTER]
        Name                kubernetes
        Match               kube.xartup-uat.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_Tag_Prefix     kube.
        Regex_Parser        custom-tag
        Merge_Log           On
        Merge_Log_Key       log_processed
        K8S-Logging.Parser  On
        K8S-Logging.Exclude Off
        Labels              Off
        Annotations         Off
        Use_Kubelet         On
        Kubelet_Port        10250
        Buffer_Size         0

    [FILTER]
        Name                kubernetes
        Match               kube.xartup-prod.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_Tag_Prefix     kube.
        Regex_Parser        custom-tag
        Merge_Log           On
        Merge_Log_Key       log_processed
        K8S-Logging.Parser  On
        K8S-Logging.Exclude Off
        Labels              Off
        Annotations         Off
        Use_Kubelet         On
        Kubelet_Port        10250
        Buffer_Size         0

    [FILTER]
        Name                parser
        Match               kube.vccedge-uat.*
        Key_Name            log
        Parser              java_multi
        Reserve_Data        True

    [FILTER]
        Name                parser
        Match               kube.vccedge-prod.*
        Key_Name            log
        Parser              java_multi
        Reserve_Data        True

    [FILTER]
        Name                parser
        Match               kube.vccedge-uat.vccedge-uat-authentication-service.*
        Key_Name            log
        Parser              auth_parser
        Reserve_Data        True

    [FILTER]
        Name                parser
        Match               kube.vccedge-prod.vccedge-prod-authentication-service.*
        Key_Name            log
        Parser              auth_parser
        Reserve_Data        True

    [FILTER]
        Name                parser
        Match               kube.vccedge-uat.vccedge-uat-global-search-service.*
        Key_Name            log
        Parser              global_search_parser
        Reserve_Data        True

    [FILTER]
        Name                parser
        Match               kube.vccedge-prod.vccedge-prod-global-search-service.*
        Key_Name            log
        Parser              global_search_parser
        Reserve_Data        True

    [FILTER]
        Name                parser
        Match               kube.vccedge-prod.vccedge-prod-orchestrator-service.*
        Key_Name            log
        Parser              orchestrator_parser
        Reserve_Data        True

    [FILTER]
        Name                parser
        Match               kube.vccedge-uat.vccedge-uat-orchestrator-service.*
        Key_Name            log
        Parser              orchestrator_parser
        Reserve_Data        True

    [FILTER]
        Name                parser
        Match               kube.vccedge-uat.vccedge-uat-research-service.*
        Key_Name            log
        Parser              research_parser
        Reserve_Data        True

    [FILTER]
        Name                parser
        Match               kube.vccedge-prod.vccedge-prod-research-service.*
        Key_Name            log
        Parser              research_parser
        Reserve_Data        True

    [OUTPUT]
        Name                es
        Match               kube.vccedge-*
        Exclude             kubernetes['namespace_name'] vccedge-prod
        Generate_ID         On
        Host                10.131.10.34
        Logstash_Format     On
        Logstash_Prefix_Key kubernetes['container_name']
        Time_Key            @timestamp
        Retry_Limit         False
        Port                9200
        Suppress_Type_Name  On

    [OUTPUT]
        Name                es
        Match               kube.vccedge-prod.*
        Logstash_Prefix_Key kubernetes['container_name']
        tls.verify          Off
        Generate_ID         On
        Replace_Dots        On
        Logstash_Format     On
        Suppress_Type_Name  On
        Log_Level           info
        tls                 Off
        Type                _doc
        Retry_Limit         False
        Time_Key            @timestamp
        Host                10.131.114.12
        Port                9200
        HTTP_User           elastic
        HTTP_Passwd         CLY9lvw_sjXpClaUQEAM

    [OUTPUT]
        Name                es
        Match               kube.xartup-uat.*
        Generate_ID         On
        Host                10.131.10.34
        Logstash_Format     On
        Logstash_Prefix_Key kubernetes['container_name']
        Time_Key            @timestamp
        Retry_Limit         False
        Port                9200
        Suppress_Type_Name  On

    [OUTPUT]
        Name                es
        Match               kube.xartup-prod.*
        Logstash_Prefix_Key kubernetes['container_name']
        tls.verify          Off
        Generate_ID         On
        Replace_Dots        On
        Logstash_Format     On
        Suppress_Type_Name  On
        Log_Level           info
        tls                 Off
        Type                _doc
        Retry_Limit         False
        Time_Key            @timestamp
        Host                10.131.114.12
        Port                9200
        HTTP_User           elastic
        HTTP_Passwd         CLY9lvw_sjXpClaUQEAM
  fluent-bit.conf: |
    [SERVICE]
        Flush                     5
        Grace                     30
        Log_Level                 info
        Daemon                    off
        Parsers_File              parsers.conf
        HTTP_Server               ${HTTP_SERVER}
        HTTP_Listen               0.0.0.0
        HTTP_Port                 ${HTTP_PORT}
        storage.path              /var/fluent-bit/state/flb-storage/
        storage.sync              normal
        storage.checksum          off
        storage.backlog.mem_limit 5M

    @INCLUDE application-log.conf
  parsers.conf: |
    [PARSER]
        Name                syslog
        Format              regex
        Regex               ^(?<time>[^ ]* {1,2}[^ ]* [^ ]*) (?<host>[^ ]*) (?<ident>[a-zA-Z0-9_\/\.\-]*)(?:\[(?<pid>[0-9]+)\])?(?:[^\:]*\:)? *(?<message>.*)$
        Time_Key            time
        Time_Format         %b %d %H:%M:%S

    [PARSER]
        Name                container_firstline
        Format              regex
        Regex               (?<log>(?<="log":")\S(?!\.).*?)(?<!\\)".*(?<stream>(?<="stream":").*?)".*(?<time>\d{4}-\d{1,2}-\d{1,2}T\d{2}:\d{2}:\d{2}\.\w*).*(?=})
        Time_Key            time
        Time_Format         %Y-%m-%dT%H:%M:%S.%LZ

    [PARSER]
        Name                cwagent_firstline
        Format              regex
        Regex               (?<log>(?<="log":")\d{4}[\/-]\d{1,2}[\/-]\d{1,2}[ T]\d{2}:\d{2}:\d{2}(?!\.).*?)(?<!\\)".*(?<stream>(?<="stream":").*?)".*(?<time>\d{4}-\d{1,2}-\d{1,2}T\d{2}:\d{2}:\d{2}\.\w*).*(?=})
        Time_Key            time
        Time_Format         %Y-%m-%dT%H:%M:%S.%LZ

    [PARSER]
        Name                java_multi
        Format              regex
        Regex               ^(?<timestamp>[\d\-:\. ]+)\s+\[(?<level>\w+)\]\s+\[traceId=(?<traceId>[^,]*),spanId=(?<spanId>[^\]]*)\]\s+\[userId=(?<userId>[^\]]*)\]\s+\[requestId=(?<requestId>[^\]]*)\]\s+\[requestTime=(?<requestTime>[^\]]*)\]\s+\[url=(?<url>[^\]]*)\]\s+\[responseCode=(?<responseCode>[^\]]*)\](?:\s+\[durationMs=(?<duration>[^\]]*)\])?\s+(?<message>.*)$
        Time_Key            time
        Time_Format         %Y-%m-%d %H:%M:%S.%L

    [PARSER]
        Name                auth_parser
        Format              regex
        Regex               ^(?<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d+)\s+\[(?<level>\w+)\]\s+\[traceId=(?<traceId>[^,\]]*),spanId=(?<spanId>[^\]]*)\]\s+\[userId=(?<userId>[^\]]*)\]\s+\[requestId=(?<requestId>[^\]]*)\]\s+\[url=(?<url>[^\]]*)\]\s+\[responseCode=(?<responseCode>\d*)\]\s+\[durationMs=(?<duration>\d*)\]\s+\[email=(?<email>[^\]]*)\]\s+(?<message>.*)$    
        Time_Key            time
        Time_Format         %Y-%m-%d %H:%M:%S.%L

    [PARSER]
        Name                global_search_parser
        Format              regex
        Regex               ^(?<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d+)\s+\[(?<level>\w+)\]\s+(?:\[traceId=(?<traceId>[^,\]]*),spanId=(?<spanId>[^\]]*)\])\s+(?:\[userId=(?<userId>[^\]]*)\])\s+(?:\[requestId=(?<requestId>[^\]]*)\])\s+(?:\[url=(?<url>[^\]]*)\])\s+(?:\[responseCode=(?<responseCode>[^\]]*)\])\s+(?:\[durationMs=(?<duration>[^\]]*)\])\s+(?:\[email=(?<email>[^\]]*)\])\s+(?:(?:Response: (?<response>\d+)\s+\|\s+Duration: (?<duration_ms>\d+)ms\s+\|\s+Body:\s+(?<body>(?:(?!\|\s+Body:).)*))|(?<message>[\s\S]*))$
        Time_Key            time
        Time_Format         %Y-%m-%d %H:%M:%S.%L

    [PARSER]
        Name                orchestrator_parser
        Format              regex
        Regex               ^(?<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d+)\s+\[(?<level>\w+)\]\s+(?:\[traceId=(?<traceId>[^,\]]*),spanId=(?<spanId>[^\]]*)\])\s+(?:\[userId=(?<userId>[^\]]*)\])\s+(?:\[requestId=(?<requestId>[^\]]*)\])\s+(?:\[url=(?<url>[^\]]*)\])\s+(?:\[responseCode=(?<responseCode>[^\]]*)\])\s+(?:\[durationMs=(?<duration>[^\]]*)\])\s+(?:\[email=(?<email>[^\]]*)\])\s+(?<message>[\s\S]*)$
        Time_Key            time
        Time_Format         %Y-%m-%d %H:%M:%S.%L

    [PARSER]
        Name                research_parser
        Format              regex
        Regex               ^(?<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d+)\s+\[(?<level>\w+)\]\s+\[traceId=(?<traceId>[^,]+),spanId=(?<spanId>[^\]]*)\]\s+\[userId=(?<userId>[^\]]*)\]\s+\[requestId=(?<requestId>[^\]]*)\]\s+\[url=(?<url>[^\]]*)\]\s+\[responseCode=(?<responseCode>[^\]]*)\]\s+\[durationMs=(?<duration>[^\]]*)\]\s+\[email=(?<email>[^\]]*)\]\s+(?<message>.+)$
        Time_Key            time
        Time_Format         %Y-%m-%d %H:%M:%S.%L

    [PARSER]
        Name                nginx
        Format              regex
        Regex               ^(?<remote>[^ ]*) (?<host>[^ ]*) (?<user>[^ ]*) \[(?<time>[^\]]*)\] "(?<method>\S+)(?: +(?<path>[^\"]*?)(?: +\S*)?)?" (?<code>[^ ]*) (?<size>[^ ]*)(?: "(?<referer>[^\"]*)" "(?<agent>[^\"]*)")
        Time_Key            time
        Time_Format         %d/%b/%Y:%H:%M:%S %z

    [PARSER]
        Name                kube-custom
        Format              regex
        Regex               (?<tag>[^.]+)?\.?(?<pod_name>[a-z0-9](?:[-a-z0-9]*[a-z0-9])?(?:\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*)_(?<namespace_name>[^_]+)_(?<container_name>.+)-(?<docker_id>[a-z0-9]{64})\.log$

    [PARSER]
        Name                custom-tag
        Format              regex
        Regex               ^(?<namespace_name>[^_]+)\.(?<container_name>.+)\.(?<pod_name>[a-z0-9](?:[-a-z0-9]*[a-z0-9])?(?:\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*)\.(?<container_id>[a-z0-9]{64}) 
